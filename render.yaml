services:
  - type: web
    name: maya-ai-receptionist
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CLINIC_NAME
        value: "Dr. Sharma's Care Clinic"
      - key: DOCTOR_NAME
        value: "Dr. Sharma"
      - key: VOICE_ENGINE
        value: "polly_kajal"
