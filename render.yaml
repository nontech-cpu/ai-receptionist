services:
  - type: web
    name: ai-receptionist
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CLINIC_NAME
        value: "Dr. Sharma Care Clinic"
      - key: DOCTOR_NAME
        value: "Dr. Sharma"
      - key: VOICE_ENGINE
        value: "polly_kajal"
